name: pro_supplier

paths:
  root: dataset/pro_supplier
  raw_csv: dataset/pro_supplier/pro_supplier.csv
  standardize_csv: dataset/pro_supplier/standardized_pro_supplier.csv
  gold_csv: dataset/pro_supplier/gold_pro_supplier.csv
  predict_csv: dataset/pro_supplier/predict_pro_supplier.csv
  model: models/pro_supplier/best_model.pt

output:
  train_txt: data/pro_supplier/pro_supplier_train.txt
  valid_txt: data/pro_supplier/pro_supplier_valid.txt
  test_txt: data/pro_supplier/pro_supplier_test.txt
  predict_txt: data/pro_supplier/pro_supplier_predict.txt

  test_result_dir: Test_Output/IJF_Docker_test_result
  predict_result_dir: predict_output/IJF_Docker_predict_result
  cluster_result_dir: predict_output/IJF_Docker_cluster_result

schema:
  raw_id_col: award_rid
  standardize_id_col: award_rid
  canonical_col: canonical_id
  join_key_raw: name
  join_key_standardize: name
  text_fields:
    - cleaned
    - address
    - city
    - prov
    - postal
    - country

supabase:
  raw_table: clean_pro_supplier
  standardize_table: pro_supplier_standardization

s3:
  prefix: pro_supplier/results

model:
  repo_id: himishra/ditto-er
  filename: models/pro_supplier/best_model.pt

split:
  train_ratio: 0.8
  valid_ratio: 0.1
  seed: 42
