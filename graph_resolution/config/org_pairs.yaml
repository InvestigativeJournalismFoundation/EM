name: org_pairs

paths:
  standardize_csv: data/org_pairs/standardized_org_pairs.csv
  pairs_csv: data/org_pairs/org_pairs_canonical_predict.csv
  clusters_csv: data/org_pairs/clusters.csv
  eval_csv: data/org_pairs/eval.csv

schema:
  raw_id_col: award_rid
  standardize_id_col: award_rid
  canonical_col: canonical_int
  join_key_raw: name
  join_key_standardize: name
  text_fields:
    - name

supabase:
  standardize_table: pro_supplier_standardization

s3:
  pairs_path: org_pairs/results
  pairs_filename: org_pairs_predict.csv

model:
  repo_id: himishra/ditto-er
  filename: models/pro_supplier/best_model.pt

split:
  train_ratio: 0.8
  valid_ratio: 0.1
  seed: 42
