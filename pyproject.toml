[project]
name = "em"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "boto3>=1.43.10",
    "faiss-cpu>=1.13.2",
    "gensim>=4.4.0",
    "jsonlines>=4.0.0",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "protobuf>=7.34.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "regex>=2026.5.9",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.5.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.14",
    "tensorboardx>=2.6.5",
    "timm>=1.0.27",
    "torch>=2.0.0",
    "torchvision>=0.1.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "wheel>=0.47.0",
    "wordfreq>=3.1.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
